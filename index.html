<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idea Planner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <div>
          <h1>Idea Planner</h1>
          <p class="subtitle">极简黑白 · 番茄时钟 · 每日规划</p>
        </div>
        <div class="autostart">
          <label class="switch">
            <input id="autostart-toggle" type="checkbox" />
            <span class="slider"></span>
          </label>
          <span>开机自启动</span>
        </div>
      </header>

      <main class="layout">
        <section class="card planner">
          <h2>每日规划</h2>
          <p class="section-subtitle">记录今天最重要的三件事与安排。</p>
          <textarea id="planner-text" placeholder="写下今日目标、重点任务与安排..."></textarea>
          <div class="planner-actions">
            <button id="save-plan" class="primary">保存安排</button>
            <span id="save-status" class="hint">自动保存已开启</span>
          </div>
          <div class="task-panel">
            <h3>今日清单</h3>
            <div class="task-input">
              <input id="task-input" type="text" placeholder="新增任务..." />
              <button id="add-task" class="ghost">添加</button>
            </div>
            <ul id="task-list" class="task-list"></ul>
          </div>
        </section>

        <section class="card timer">
          <h2>番茄时钟</h2>
          <p class="section-subtitle">25分钟专注 + 5分钟休息，专注更高效。</p>
          <div class="timer-display">
            <span id="timer-label">专注中</span>
            <div class="time" id="timer-time">25:00</div>
            <div class="progress">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
          </div>
          <div class="timer-controls">
            <button id="start-timer" class="primary">开始</button>
            <button id="pause-timer" class="ghost">暂停</button>
            <button id="reset-timer" class="ghost">重置</button>
          </div>
          <div class="timer-settings">
            <label>
              专注 (分钟)
              <input id="focus-length" type="number" min="10" max="90" value="25" />
            </label>
            <label>
              休息 (分钟)
              <input id="break-length" type="number" min="3" max="30" value="5" />
            </label>
          </div>
        </section>

        <section class="card links">
          <h2>快速对话入口</h2>
          <p class="section-subtitle">一键打开与 ChatGPT / Gemini 的对话。</p>
          <div class="link-grid">
            <a class="link-card" href="https://chat.openai.com" target="_blank" rel="noreferrer">
              <span>ChatGPT</span>
              <span class="link-hint">openai.com</span>
            </a>
            <a class="link-card" href="https://gemini.google.com" target="_blank" rel="noreferrer">
              <span>Gemini</span>
              <span class="link-hint">google.com</span>
            </a>
          </div>
        </section>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
